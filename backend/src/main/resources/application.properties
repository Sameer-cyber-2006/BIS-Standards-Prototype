spring.application.name=bis-assistant

# Server
server.port=8080

# Multipart upload (Procurement Analyzer) - prototype only accepts the file, content is not parsed
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.example.bisassistant=INFO
